name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup environment and build debug APK
        shell: powershell
        run: |
          ./setup.ps1
          ./apk.ps1 -Debug

      - uses: actions/upload-artifact@v4
        with:
          name: campus-login-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
